<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<base href="/agent/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARD-PRO — агент</title>
<style>
:root{--bg:#0b0d10;--pnl:#14181d;--line:#242b33;--tx:#e6ebf0;--dm:#8a949f;--ok:#39d98a;--no:#e2574c;--ac:#5aa9ff;--warn:#e0b341}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.4px}.brand span{color:var(--ac)}
select,button,input,textarea{font:inherit;color:var(--tx);background:#101418;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:disabled{opacity:.5}
.wrap{flex:1;display:grid;grid-template-columns:245px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px}
aside .s{padding:8px 10px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside .s:hover{background:#101418;color:var(--tx)}
aside .s.on{background:#16202a;color:var(--tx)}
main{display:flex;flex-direction:column;min-height:0}
#feed{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--pnl);max-width:min(920px,100%)}
.msg.user{background:#141f2b;border-color:#1f3a52}
.msg.tool{background:#101418;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#b9d3f0}
.msg.err{border-color:#5a2a26;color:#ffb4ad}
.msg.status{color:var(--dm);font-size:12.5px;border-style:dashed}
.msg.think{color:var(--dm);font-size:13px;border-style:dotted}
.msg pre{white-space:pre-wrap;margin:6px 0 0;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.ta{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;min-height:64px}
.row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dm)}
.badge{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--dm)}
</style></head>
<body>
<header>
  <div class="brand">HARD-PRO <span>agent</span></div>
  <div class="row">модель
    <select id="model"></select>
    <button id="apply">переключить</button>
  </div>
  <button id="new">новый чат</button>
  <span class="badge" id="state">готов</span>
</header>
<div class="wrap">
  <aside id="list"></aside>
  <main>
    <div id="feed"></div>
    <div class="ta">
      <textarea id="text" placeholder="Задача агенту: посмотри проект, поправь код, запусти и проверь…"></textarea>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button id="send">отправить</button>
        <button id="stop" disabled>стоп</button>
      </div>
    </div>
  </main>
</div>
<script>
const feed = document.getElementById('feed');
const stateEl = document.getElementById('state');
let sid = null, ctrl = null;

function add(cls, title, body){
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  const head = document.createElement('div');
  head.style.fontSize = '12px'; head.style.color = 'var(--dm)';
  head.textContent = title;
  el.appendChild(head);
  if (body){
    const pre = document.createElement('pre');
    pre.textContent = body;
    el.appendChild(pre);
  }
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
  return el;
}

async function refreshSessions(){
  const r = await fetch('api/sessions');
  const d = await r.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  d.sessions.forEach(s=>{
    const el = document.createElement('div');
    el.className = 's' + (s.id === sid ? ' on' : '');
    el.textContent = s.title;
    el.title = new Date(s.updated*1000).toLocaleString() + ' · ' + s.model;
    el.onclick = ()=>openSession(s.id);
    list.appendChild(el);
  });
}

async function openSession(id){
  sid = id;
  feed.innerHTML = '';
  const r = await fetch('api/sessions/'+id+'/messages');
  const d = await r.json();
  d.messages.forEach(m=>{
    if (m.role === 'user') add('user','вы', m.content);
    else if (m.role === 'assistant'){
      if (m.content) add('assistant','модель', m.content);
      (m.extra.tool_calls||[]).forEach(c=>add('tool','вызов '+c.function.name, c.function.arguments));
    } else if (m.role === 'tool') add('tool','результат '+(m.extra.name||''), m.content.slice(0,4000));
  });
  refreshSessions();
}

async function send(){
  const text = document.getElementById('text').value.trim();
  if (!text) return;
  document.getElementById('text').value = '';
  add('user','вы', text);
  document.getElementById('send').disabled = true;
  document.getElementById('stop').disabled = false;
  stateEl.textContent = 'работаю';
  ctrl = new AbortController();
  try {
    const r = await fetch('api/chat', {
      method:'POST', signal: ctrl.signal,
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, session_id: sid, model: document.getElementById('model').value})
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts){
        const line = part.split('\n').find(l=>l.startsWith('data:'));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch(e){ continue; }
        if (ev.type === 'session'){ sid = ev.id; refreshSessions(); }
        else if (ev.type === 'status') stateEl.textContent = ev.text;
        else if (ev.type === 'reasoning') add('think','рассуждение', ev.text);
        else if (ev.type === 'assistant') add('assistant','модель', ev.text);
        else if (ev.type === 'tool') add('tool','вызов '+ev.name, JSON.stringify(ev.args, null, 1));
        else if (ev.type === 'tool_result') add('tool','результат '+ev.name, JSON.stringify(ev.result, null, 1).slice(0,6000));
        else if (ev.type === 'usage' || ev.type === 'note') add('status', ev.type, ev.text);
        else if (ev.type === 'error') add('err','ошибка', ev.text);
        else if (ev.type === 'done') stateEl.textContent = 'готов · ' + (ev.wall_s||'?') + ' c';
      }
    }
  } catch(e){
    if (e.name !== 'AbortError') add('err','сбой', String(e));
  } finally {
    document.getElementById('send').disabled = false;
    document.getElementById('stop').disabled = true;
    ctrl = null;
    refreshSessions();
  }
}

document.getElementById('send').onclick = send;
document.getElementById('stop').onclick = ()=>{ if (ctrl) ctrl.abort(); };
document.getElementById('text').addEventListener('keydown', e=>{
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send();
});
document.getElementById('new').onclick = ()=>{ sid = null; feed.innerHTML = ''; stateEl.textContent='готов'; refreshSessions(); };

async function loadModels(){
  const sel = document.getElementById('model');
  try{
    const r = await fetch('api/models');
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    sel.innerHTML = '';
    d.models.forEach(m=>{
      const o = document.createElement('option');
      o.value = m.id;
      const gpu = m.gpus && m.gpus.length ? ' · GPU '+m.gpus.join(',') : '';
      o.textContent = m.label + gpu + (m.online ? ' ●' : (m.running ? ' ◐' : ''));
      sel.appendChild(o);
    });
    if (d.roles && d.roles.agent) sel.value = d.roles.agent;
  }catch(e){
    sel.innerHTML = '<option value="">каталог недоступен</option>';
  }
}

document.getElementById('apply').onclick = async (e)=>{
  const model = document.getElementById('model').value;
  if (!model) return;
  const btn = e.target;
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = 'поднимаю…';
  stateEl.textContent = model + ': загрузка';
  try{
    const r = await fetch('api/models/switch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({role:'agent', model, start:true})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP '+r.status));
    stateEl.textContent = 'готов · ' + model + ' на GPU ' + (d.gpus||[]).join(',');
    add('status','переключение', model + ' → карта ' + (d.gpus||[]).join(',') +
        ' · порт ' + d.port + (d.evicted && d.evicted.length ? ' · вытеснено: '+d.evicted.join(', ') : ''));
  }catch(err){
    add('err','переключение', String(err));
    stateEl.textContent = 'ошибка';
  }finally{
    btn.disabled = false;
    btn.textContent = prev;
    loadModels();
  }
};

refreshSessions();
loadModels();
</script></body></html>
